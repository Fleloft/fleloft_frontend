type Mutation {
  createCheckin(input: CreateCheckinInput!): CreateCheckinPayload! @authorize @cost(weight: "10")
  updateCheckin(input: UpdateCheckinInput!): UpdateCheckinPayload! @authorize @cost(weight: "10")
  deleteCheckin(input: DeleteCheckinInput!): DeleteCheckinPayload! @authorize @cost(weight: "10")
  createFile(input: CreateFileInput!): CreateFilePayload! @authorize @cost(weight: "10")
  updateFile(input: UpdateFileInput!): UpdateFilePayload! @authorize @cost(weight: "10")
  deleteFile(input: DeleteFileInput!): DeleteFilePayload! @authorize @cost(weight: "10")
  updatePlace(input: UpdatePlaceInput!): UpdatePlacePayload! @authorize @cost(weight: "10")
  createRoom(input: CreateRoomInput!): CreateRoomPayload! @authorize @cost(weight: "10")
  updateRoom(input: UpdateRoomInput!): UpdateRoomPayload! @authorize @cost(weight: "10")
  deleteRoom(input: DeleteRoomInput!): DeleteRoomPayload! @authorize @cost(weight: "10")
  createUser(input: CreateUserInput!): CreateUserPayload! @authorize @cost(weight: "10")
  updateUser(input: UpdateUserInput!): UpdateUserPayload! @authorize @cost(weight: "10")
  deleteUser(input: DeleteUserInput!): DeleteUserPayload! @authorize @cost(weight: "10")
  setUserRole(input: SetUserRoleInput!): SetUserRolePayload! @authorize(policy: "admin") @cost(weight: "10")
}

"Information about pagination in a connection."
type PageInfo {
  "Indicates whether more edges exist following the set defined by the clients arguments."
  hasNextPage: Boolean!
  "Indicates whether more edges exist prior the set defined by the clients arguments."
  hasPreviousPage: Boolean!
  "When paginating backwards, the cursor to continue."
  startCursor: String
  "When paginating forwards, the cursor to continue."
  endCursor: String
}

