  files("Returns the first _n_ elements from the list." first: Int "Returns the elements in the list that come after the specified cursor." after: String "Returns the last _n_ elements from the list." last: Int "Returns the elements in the list that come before the specified cursor." before: String where: FileModelFilterInput @cost(weight: "10") order: [FileModelSortInput!] @cost(weight: "10")): FilesConnection @authorize @listSize(assumedSize: 50, slicingArguments: [ "first", "last" ], slicingArgumentDefaultValue: 10, sizedFields: [ "edges", "nodes" ], requireOneSlicingArgument: false) @cost(weight: "10")
  fileById(id: ID!): FileModel @authorize @cost(weight: "10")
  filesById(ids: [ID!]!): [FileModel!]! @authorize @cost(weight: "10")
  places("Returns the first _n_ elements from the list." first: Int "Returns the elements in the list that come after the specified cursor." after: String "Returns the last _n_ elements from the list." last: Int "Returns the elements in the list that come before the specified cursor." before: String where: PlaceModelFilterInput @cost(weight: "10") order: [PlaceModelSortInput!] @cost(weight: "10")): PlacesConnection @authorize @listSize(assumedSize: 50, slicingArguments: [ "first", "last" ], slicingArgumentDefaultValue: 10, sizedFields: [ "edges", "nodes" ], requireOneSlicingArgument: false) @cost(weight: "10")
  placeById(id: ID!): PlaceModel @authorize @cost(weight: "10")
  placesById(ids: [ID!]!): [PlaceModel!]! @authorize @cost(weight: "10")
  roles("Returns the first _n_ elements from the list." first: Int "Returns the elements in the list that come after the specified cursor." after: String "Returns the last _n_ elements from the list." last: Int "Returns the elements in the list that come before the specified cursor." before: String where: RoleModelFilterInput @cost(weight: "10") order: [RoleModelSortInput!] @cost(weight: "10")): RolesConnection @authorize @listSize(assumedSize: 50, slicingArguments: [ "first", "last" ], slicingArgumentDefaultValue: 10, sizedFields: [ "edges", "nodes" ], requireOneSlicingArgument: false) @cost(weight: "10")
  roleById(id: ID!): RoleModel @authorize @cost(weight: "10")
  rolesById(ids: [ID!]!): [RoleModel!]! @authorize @cost(weight: "10")
  rooms("Returns the first _n_ elements from the list." first: Int "Returns the elements in the list that come after the specified cursor." after: String "Returns the last _n_ elements from the list." last: Int "Returns the elements in the list that come before the specified cursor." before: String where: RoomModelFilterInput @cost(weight: "10") order: [RoomModelSortInput!] @cost(weight: "10")): RoomsConnection @authorize @listSize(assumedSize: 50, slicingArguments: [ "first", "last" ], slicingArgumentDefaultValue: 10, sizedFields: [ "edges", "nodes" ], requireOneSlicingArgument: false) @cost(weight: "10")
  roomById(id: ID!): RoomModel @authorize @cost(weight: "10")
  roomsById(ids: [ID!]!): [RoomModel!]! @authorize @cost(weight: "10")
  users("Returns the first _n_ elements from the list." first: Int "Returns the elements in the list that come after the specified cursor." after: String "Returns the last _n_ elements from the list." last: Int "Returns the elements in the list that come before the specified cursor." before: String where: UserModelFilterInput @cost(weight: "10") order: [UserModelSortInput!] @cost(weight: "10")): UsersConnection @authorize @listSize(assumedSize: 50, slicingArguments: [ "first", "last" ], slicingArgumentDefaultValue: 10, sizedFields: [ "edges", "nodes" ], requireOneSlicingArgument: false) @cost(weight: "10")
