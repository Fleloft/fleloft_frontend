  dataSaida: LocalDate
  chekin: DateTime
  checkout: DateTime
  observations: String
  status: CheckinStatusEnum!
  roomId: Long!
  userId: Long!
  id: ID!
  dbId: String!
}

"A connection to a list of items."
type CheckinsConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [CheckinsEdge!]
  "A flattened list of the nodes."
  nodes: [CheckinModel!]
}

"An edge in a connection."
type CheckinsEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: CheckinModel!
}

